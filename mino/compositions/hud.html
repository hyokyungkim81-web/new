<!doctype html>
<html data-composition-variables='[{"id":"offset","type":"number","label":"Global time at this clip start (s)","default":0}]'>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #hud-root { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: difference; }
        #hud-root .hud-tl { position: absolute; left: 64px; top: 72px; font-size: 26px; line-height: 40px; letter-spacing: 0.04em; }
        #hud-root .hud-br { position: absolute; right: 64px; bottom: 72px; font-size: 26px; letter-spacing: 0.08em; }
        #hud-root .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #c8ff00; margin: 0 12px 2px 14px; vertical-align: middle; }
      </style>
      <div id="hud-root" data-composition-id="hud" data-width="1080" data-height="1920">
        <div class="hud">
          <div class="hud-tl">
            <div>MINO · <span id="hud-tc">00:00:00</span></div>
            <div>STATUS<span class="dot" id="hud-dot"></span><span id="hud-status">GENERATING</span></div>
            <div>SCENE&nbsp;&nbsp;<span id="hud-scene">LOGO</span></div>
          </div>
          <div class="hud-br"><span id="hud-num">01</span> / 10</div>
        </div>
      </div>
      <script>
        (function () {
          const { offset } = window.__hyperframes.getVariables();
          const FPS = 60;
          const SCENES = [
            [0, "LOGO"], [3, "SCRIPT · DESIGN · VIDEO"], [6, "DASHBOARD"], [10, "TEMPLATES"],
            [13, "ORBIT"], [15.5, "PROMPT"], [18.5, "NUMBERS"], [21.5, "CHAT EDIT"],
            [25.5, "MONTAGE"], [27.5, "MADE BY MINO"],
          ];
          const tc = document.getElementById("hud-tc");
          const num = document.getElementById("hud-num");
          const scene = document.getElementById("hud-scene");
          const status = document.getElementById("hud-status");
          const pad = (n) => String(n).padStart(2, "0");
          const clock = { t: 0 };
          function paint() {
            const g = offset + clock.t + 1e-6;
            const f = Math.floor(g * FPS);
            tc.textContent = pad(Math.floor(f / FPS / 60)) + ":" + pad(Math.floor(f / FPS) % 60) + ":" + pad(f % FPS);
            let i = 0;
            for (let k = 0; k < SCENES.length; k++) if (g >= SCENES[k][0]) i = k;
            num.textContent = pad(i + 1);
            scene.textContent = SCENES[i][1];
            status.textContent = i === SCENES.length - 1 ? "READY" : "GENERATING";
          }
          const tl = gsap.timeline({ paused: true, onUpdate: paint });
          tl.to(clock, { t: 40, duration: 40, ease: "none", onUpdate: paint }, 0);
          // Status dot blinks once a second.
          tl.fromTo("#hud-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "steps(1)", repeat: 79, yoyo: true }, 0);
          paint();
          window.__timelines["hud"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
