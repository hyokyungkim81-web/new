        #s08 .btn { position: absolute; width: 6px; border-radius: 3px; background: linear-gradient(90deg, #555, #222); }

        #s08 .pv-cap .hl { color: #c8ff00; }

        #s08 .wave .set { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; }

        #s08 .wave .set.bright b { background: #c8ff00; box-shadow: 0 0 10px rgba(200, 255, 0, 0.8); }
        #s08 .prog { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: #c8ff00; transform-origin: 0 50%; }
        #s08 .chathead { display: flex; justify-content: space-between; font-size: 16px; color: rgba(244, 244, 240, 0.62); letter-spacing: 0.08em; height: 22px; margin-top: 4px; }
        #s08 .chatview { position: relative; flex: 1; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 70px); mask-image: linear-gradient(180deg, transparent 0, #000 70px); }
        #s08-list { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; flex-direction: column; gap: 12px; }
        #s08 .m { align-self: flex-start; max-width: 340px; padding: 14px 18px; border-radius: 20px 20px 20px 6px; font-size: 19px; line-height: 26px; background: #232325; }
        #s08 .m.me { align-self: flex-end; border-radius: 20px 20px 6px 20px; background: #3a3a3d; }
        #s08 .m.ai { background: #c8ff00; color: #0a0a0a; font-weight: 600; }
        #s08 .inputbar { height: 60px; border-radius: 30px; background: #18181a; border: 1px solid rgba(244, 244, 240, 0.1); display: flex; align-items: center; padding: 0 8px 0 22px; font-size: 17px; color: rgba(244, 244, 240, 0.62); }
        #s08 .inputbar span { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; background: #c8ff00; }
        #s08-off { position: absolute; inset: 0; background: #000; z-index: 4; }
        #s08-flash { position: absolute; inset: 0; background: #f4f4f0; opacity: 0; z-index: 6; }

        #s08 .bubbles { position: absolute; left: 632px; top: 640px; width: 400px; }
        #s08 .bub { position: absolute; left: 0; display: inline-flex; align-items: center; gap: 10px; height: 92px; padding: 0 30px; border-radius: 30px 30px 30px 8px; font-size: 34px; font-weight: 600; white-space: nowrap; transform-origin: 0 100%; }
        #s08 .bub.me { background: #2b2b2e; color: #f4f4f0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 20px 40px rgba(0, 0, 0, 0.5); }
        #s08 .bub.ai { background: #c8ff00; color: #0a0a0a; box-shadow: 0 0 26px rgba(200, 255, 0, 0.65), 0 0 70px rgba(200, 255, 0, 0.3); }
        #s08 .who { position: absolute; left: 4px; top: -30px; font-family: "Plex Mono", monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; color: rgba(244, 244, 240, 0.62); }
        #s08 .bub svg, #s08 .m svg { display: inline-block; flex: none; }
        #s08 .ch { display: inline-block; }
      </style>

      <div id="s08" data-composition-id="s08" data-width="1080" data-height="1920">
        <div class="bg-black">
          <div class="bg-pool" id="s08-pool" data-layout-allow-overflow></div>
          <div class="bg-grid" id="s08-grid" data-layout-allow-overflow></div>
        </div>
        <div id="s08-aura" data-layout-allow-overflow></div>
        <div id="s08-floor"></div>

        <svg width="0" height="0" style="position: absolute">
          <filter id="s08-vblur" x="-10%" y="-30%" width="120%" height="160%">
            <feGaussianBlur id="s08-vblur-std" stdDeviation="0 0" />
          </filter>
        </svg>

        <div class="stage">
          <div id="s08-rise">
            <div id="s08-turn">
              <div id="s08-phone">
                <div class="btn" style="left: -4px; top: 210px; height: 70px"></div>
                <div class="btn" style="left: -4px; top: 300px; height: 70px"></div>
                <div class="btn" style="right: -4px; top: 260px; height: 110px"></div>
                <div class="screen">
                  <div class="island"><div class="lens"></div></div>
                  <div class="app">
                    <div class="row s08-ui status"><span>9:41</span><span>5G ▮▮▮</span></div>
                    <div class="row s08-ui apphead"><div class="logo">MINO<sup>AI</sup></div><div class="avatar"></div></div>
                    <div class="row s08-ui preview">
                      <div class="pv-sun"></div>
                      <div class="pv-desk"></div>
                      <div class="pv-laptop"><i></i></div>
                      <div class="pv-tag">REELS · 0:28</div>
                      <div class="pv-cap" id="s08-cap"><span style="font-size: 22px">직장인을 위한 <span class="hl">클로드</span> 활용법</span></div>
                      <div class="wave">
                        <div class="set" id="s08-wave-a"></div>
                        <div class="set bright" id="s08-wave-b"></div>
                      </div>
                      <div class="prog" id="s08-prog"></div>
                    </div>
                    <div class="row s08-ui chathead"><span>CHAT</span><span>편집 요청</span></div>
                    <div class="row s08-ui chatview">
                      <div id="s08-list">
                        <div class="m ai s08-m">릴스 초안이 완성됐어요</div>
                        <div class="m me s08-m">자막 더 크게</div>
                        <div class="m ai s08-m">수정했어요 <svg width="18" height="14" viewBox="0 0 18 14"><path d="M1.5 7.5 6.5 12 16.5 2" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
                        <div class="m me s08-m">음악 밝게</div>
                        <div class="m ai s08-m">완료 <svg width="18" height="14" viewBox="0 0 18 14"><path d="M1.5 7.5 6.5 12 16.5 2" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
                      </div>
                    </div>
                    <div class="row s08-ui inputbar">수정할 내용을 말해 주세요<span></span></div>
                  </div>
                  <div id="s08-off"></div>
                  <div id="s08-flash"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bubbles">
          <div class="bub me s08-bub" style="top: 0"><span class="who" data-layout-allow-overflow>YOU</span><span class="type">자막 더 크게</span></div>
          <div class="bub ai s08-bub" style="top: 170px"><span class="who" data-layout-allow-overflow>MINO</span><span class="type">수정했어요</span><svg class="type-end" width="30" height="24" viewBox="0 0 18 14"><path d="M1.5 7.5 6.5 12 16.5 2" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          <div class="bub me s08-bub" style="top: 340px"><span class="who" data-layout-allow-overflow>YOU</span><span class="type">음악 밝게</span></div>
          <div class="bub ai s08-bub" style="top: 510px"><span class="who" data-layout-allow-overflow>MINO</span><span class="type">완료</span><svg class="type-end" width="30" height="24" viewBox="0 0 18 14"><path d="M1.5 7.5 6.5 12 16.5 2" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        </div>
      </div>

      <script>
        (function () {
          const G0 = 21.5;
          const DUR = 4;
          const POOL_PHASE = 0.62;
          const q = (s) => document.querySelector("#s08 " + s);
          const qa = (s) => Array.from(document.querySelectorAll("#s08 " + s));

          // Waveforms: a calm set, and a brighter, busier set swapped in after "음악 밝게".
          const calm = [], bright = [];
          for (let i = 0; i < 30; i++) {
            calm.push(10 + 26 * Math.abs(Math.sin(i * 0.55)) * (0.5 + 0.5 * Math.cos(i * 0.21)));
            bright.push(16 + 30 * Math.abs(Math.sin(i * 1.3 + 0.4)) * (0.65 + 0.35 * Math.sin(i * 0.8)));
          }
          const fill = (el, hs) => hs.forEach((h) => { const b = document.createElement("b"); b.style.height = h.toFixed(1) + "px"; el.appendChild(b); });
          fill(q("#s08-wave-a"), calm);
          fill(q("#s08-wave-b"), bright);

          // Split bubble text into characters for typing.
          qa(".type").forEach((el) => {
            const chars = Array.from(el.textContent);
            el.textContent = "";
            chars.forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c === " " ? " " : c; el.appendChild(s); });
          });

          const tl = gsap.timeline({ paused: true });

          // Background drift + light pool on its 10s orbit.
          tl.fromTo("#s08-grid", { x: 0, y: 0 }, { x: 40, y: 40, duration: DUR, ease: "none" }, 0);
          const poolAt = (t) => { const a = 2 * Math.PI * ((G0 + t) / 10 + POOL_PHASE); return { x: 540 + 430 * Math.cos(a), y: 1100 + 620 * Math.sin(a) }; };
          const keys = [];
          for (let t = 0; t <= DUR + 1e-9; t += 0.25) keys.push(poolAt(t));
          tl.fromTo("#s08-pool", keys[0], { keyframes: keys.slice(1), duration: DUR, ease: "none" }, 0);

          // Lime aura behind the phone breathes.
          tl.fromTo("#s08-aura", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.05);
          tl.fromTo("#s08-aura", { scale: 1 }, { scale: 1.06, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.75);
          tl.fromTo("#s08-floor", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.1);

          // Phone rises (shutter blur), then turns slowly from 8° to face front, floating gently.
          tl.fromTo("#s08-rise", { y: 820, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
          tl.set("#s08-rise", { filter: "url(#s08-vblur)" }, 0);
          tl.fromTo("#s08-vblur-std", { attr: { stdDeviation: "0 50" } }, { attr: { stdDeviation: "0 0" }, duration: 0.55, ease: "power2.out" }, 0);
          tl.set("#s08-rise", { filter: "none" }, 0.56);
          tl.fromTo("#s08-turn", { rotationY: 8 }, { rotationY: 0, duration: 2.8, ease: "power2.out" }, 0);
          tl.fromTo("#s08-turn", { y: 0 }, { y: -12, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, 0.7);

          // Screen wakes: flash, then the app UI draws top to bottom one row at a time.
          tl.fromTo("#s08-off", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none" }, 0.58);
          tl.fromTo("#s08-flash", { opacity: 0 }, { opacity: 0.35, duration: 0.05, ease: "none", yoyo: true, repeat: 1 }, 0.58);
          tl.fromTo(qa(".s08-ui"), { opacity: 0, y: -14, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.22, ease: "power2.out", stagger: 0.07 }, 0.66);

          // Preview: progress runs, waveform pulses (constant motion inside the phone).
          tl.fromTo("#s08-prog", { scaleX: 0.08 }, { scaleX: 0.8, duration: DUR - 0.7, ease: "none" }, 0.7);
          qa("#s08-wave-a b, #s08-wave-b b").forEach((b, i) => {
            const d = 0.22 + (i % 5) * 0.04;
            tl.fromTo(b, { scaleY: 1 }, { scaleY: 0.45, duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.floor((DUR - 0.9) / d) }, 0.9 + (i % 7) * 0.03);
          });
          tl.fromTo("#s08-wave-b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.2);
          tl.fromTo("#s08-wave-a", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 3.2);

          // In-phone chat: each message rises from the bottom and pushes the older ones up.
          const msgs = qa(".s08-m");
          const STEP = 66;
          tl.fromTo("#s08-list", { y: STEP * 4 }, { y: STEP * 4, duration: 0.01 }, 0);
          tl.fromTo(msgs[0], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.0);
          tl.fromTo(msgs.slice(1), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", stagger: 0.6 }, 1.38);
          for (let k = 1; k <= 4; k++) {
            tl.to("#s08-list", { y: STEP * (4 - k), duration: 0.25, ease: "power2.out" }, 1.38 + (k - 1) * 0.6);
          }

          // Outside bubbles unfold in order and type their text.
          qa(".s08-bub").forEach((bub, k) => {
            const at = 1.25 + k * 0.6;
            tl.fromTo(bub, { scale: 0.4, opacity: 0, x: -40 }, { scale: 1, opacity: 1, x: 0, duration: 0.28, ease: "back.out(2)" }, at);
            tl.fromTo(bub.querySelector(".who"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, at + 0.05);
            tl.fromTo(bub.querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.045 }, at + 0.1);
            const end = bub.querySelector(".type-end");
            if (end) tl.fromTo(end, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, at + 0.1 + bub.querySelectorAll(".ch").length * 0.045);
          });
          tl.fromTo(qa(".s08-bub.ai"), { boxShadow: "0 0 26px rgba(200,255,0,0.65), 0 0 70px rgba(200,255,0,0.3)" },
            { boxShadow: "0 0 34px rgba(200,255,0,0.85), 0 0 90px rgba(200,255,0,0.4)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 1.9);

          // Preview reacts: captions grow after "수정했어요".
          tl.fromTo("#s08-cap", { scale: 1 }, { scale: 1.55, duration: 0.3, ease: "back.out(2)" }, 2.05);

          window.__timelines["s08"] = tl;
        })();
      </script>
    </template>
