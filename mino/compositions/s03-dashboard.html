      </style>

                        <div class="card s03-card"><h6>평균 제작 시간</h6><div class="num"><div class="odo" data-value="4"></div><div class="unit">분</div></div></div>

      <script>
        (function () {
          const G0 = 6; // global start time of this scene
          const DUR = 4;
          const POOL_PHASE = 0.15; // where the lime light sits for this scene (fraction of its 10s orbit)
          const q = (s) => document.querySelector("#s03 " + s);
          const qa = (s) => Array.from(document.querySelectorAll("#s03 " + s));

          // Odometer counters: one 0-9 strip per digit, rolled from 0.
          qa(".odo").forEach((odo) => {
            const v = odo.dataset.value;
            v.split("").forEach((d, i) => {
              const col = document.createElement("div");
              col.className = "col";
              const strip = document.createElement("div");
              strip.className = "strip";
              strip.setAttribute("data-layout-allow-overflow", "");
              for (let k = 0; k < 20; k++) {
                const b = document.createElement("b");
                b.textContent = k % 10;
                strip.appendChild(b);
              }
              // Lower digits spin a full turn extra so every counter visibly rolls.
              strip.dataset.target = Number(d) + (i === v.length - 1 ? 10 : 0);
              col.appendChild(strip);
              odo.appendChild(col);
            });
          });

          const tl = gsap.timeline({ paused: true });

          // Background: grid drifts diagonally, light pool orbits on a 10s period.
          tl.fromTo("#s03-grid", { x: 0, y: 0 }, { x: 40, y: 40, duration: DUR, ease: "none" }, 0);
          const poolAt = (t) => {
            const a = 2 * Math.PI * ((G0 + t) / 10 + POOL_PHASE);
            return { x: 540 + 430 * Math.cos(a), y: 700 + 620 * Math.sin(a) };
          };
          const keys = [];
          for (let t = 0; t <= DUR + 1e-9; t += 0.25) keys.push(poolAt(t));
          tl.fromTo("#s03-pool", keys[0], { keyframes: keys.slice(1), duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s03-pool", { opacity: 0.18 }, { opacity: 0.25, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0);

          // Panel floats up empty, with a vertical shutter blur that clears.
          tl.fromTo("#s03-float", { y: 560, opacity: 0, scale: 0.92, rotationX: 16 },
            { y: 0, opacity: 1, scale: 1, rotationX: 0, duration: 0.45, ease: "power3.out" }, 0);
          tl.set("#s03-float", { filter: "url(#s03-vblur)" }, 0);
          tl.fromTo("#s03-vblur-std", { attr: { stdDeviation: "0 46" } }, { attr: { stdDeviation: "0 0" }, duration: 0.4, ease: "power2.out" }, 0);
          tl.set("#s03-float", { filter: "none" }, 0.41);

          // Constant motion: slow ±6° sway, gentle push in/out, breathing glow.
          tl.fromTo("#s03-sway", { rotationY: -6 }, { rotationY: 6, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.fromTo("#s03-sway", { z: -40 }, { z: 50, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 0.4);
          tl.fromTo("#s03-glow", { opacity: 0.22 }, { opacity: 0.38, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);

          // Sidebar: 5 projects, top to bottom, 0.08s apart.
          tl.fromTo(qa(".s03-side"), { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 0.45);

          tl.fromTo("#s03-new", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.85);

          // KPI cards pop left to right; their digits roll up from 0.
          tl.fromTo(qa(".s03-card"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(2.2)", stagger: 0.1 }, 0.9);
          qa(".s03-card").forEach((card, ci) => {
            card.querySelectorAll(".strip").forEach((strip) => {
              tl.fromTo(strip, { y: 0 }, { y: -70 * Number(strip.dataset.target), duration: 0.75, ease: "power3.out" }, 0.95 + ci * 0.1);
            });
          });

          // Line graph draws left to right in 0.8s, then the area and tip arrive.
          tl.fromTo("#s03-linepath", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 1.3);
          tl.fromTo("#s03-areapath", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.75);
          tl.fromTo("#s03-tip", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.08);

          // Seven bars rise left to right.
          tl.fromTo(qa(".s03-bar"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "back.out(1.5)", stagger: 0.06 }, 1.85);

          // Table builds row by row, then one row lights up lime.
          tl.fromTo(qa(".s03-row"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out", stagger: 0.1 }, 2.3);
          tl.fromTo("#s03-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power3.out" }, 3.2);
          tl.fromTo(qa("#s03-hlrow > div:not(.hl)"), { color: "#f4f4f0" }, { color: "#0a0a0a", duration: 0.12, ease: "none" }, 3.26);

          window.__timelines["s03"] = tl;
        })();
      </script>
